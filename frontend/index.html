<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Neighborhood Watch</title>
		<link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
		<link rel="stylesheet" href="css/style.css" />
	</head>
	<body>
		<header class="header">
			<div>
				<h1>Neighborhood Watch</h1>
				<p>Register and follow sightings in your neighborhood</p>
			</div>
			<a id="logout" href="login.html" class="logout-link"></a>
		</header>

		<main class="layout">
			<section class="map-panel">
				<h2>Map</h2>
				<div id="map" class="map-placeholder"></div>
			</section>

			<aside class="side-panel">
				<section class="report-form">
					<h2>Report a sighting</h2>
					<form id="report-form">
						<label for="user-id">Your user id</label>
						<input type="number" id="user-id" name="userId" min="1" required />

						<label for="person-name">Who did you see?</label>
						<input type="text" id="person-name" name="personName" maxlength="100" required />

						<label for="category">Category</label>
						<select id="category" name="categoryId">
							<option value="">-- choose a category --</option>
						</select>

						<label for="description">Description</label>
						<textarea id="description" name="description" rows="4" minlength="5" maxlength="2000" required></textarea>

						<fieldset class="coords">
							<legend>Location</legend>
						<label for="latitude">Latitude</label>
						<input type="number" id="latitude" name="latitude" step="any" min="50.95" max="51.15" required />
						<label for="longitude">Longitude</label>
						<input type="number" id="longitude" name="longitude" step="any" min="3.6" max="3.85" required />
						</fieldset>

						<label for="direction">Direction (optional)</label>
						<input type="text" id="direction" name="direction" maxlength="2" placeholder="N, NE, SSE ..." />

						<div id="form-error" class="error" hidden></div>

						<button type="submit">Submit report</button>
					</form>
				</section>

				<section class="recent-reports">
					<h2>Recent reports</h2>
					<ul id="recent-reports" class="report-list">
						<li>No reports yet.</li>
					</ul>
				</section>
			</aside>
		</main>

		<section class="stats-panel">
			<h2>Statistics</h2>
			<div class="stats-grid">
				<div class="stat-card">
					<h3>Total reports</h3>
					<p id="stat-total" class="stat-total">-</p>
				</div>
				<div class="stat-card">
					<h3>Most active users</h3>
					<ul id="stat-users" class="stat-list"></ul>
				</div>
				<div class="stat-card">
					<h3>Most reported persons</h3>
					<ul id="stat-persons" class="stat-list"></ul>
				</div>
				<div class="stat-card">
					<h3>Reports per category</h3>
					<ul id="stat-categories" class="stat-list"></ul>
				</div>
				<div class="stat-card">
					<h3>Most reported areas</h3>
					<ul id="stat-areas" class="stat-list"></ul>
				</div>
			</div>
		</section>

		<script src="vendor/leaflet/leaflet.js"></script>
		<script src="js/app.js"></script>
	</body>
</html>
