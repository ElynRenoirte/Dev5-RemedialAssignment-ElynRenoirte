version: "3.9"

services:
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "3000:3000"

    env_file:
      - .env.template

    depends_on:
      - mysql

    #volumes:
    # - ./backend:/app

  mysql:
    image: mysql:8

    restart: always

    env_file:
      - .env.template

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  mysql_data:
